<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Block</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f8f1ec;
      color: #2f2a26;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 430px;
      width: 100%;
      text-align: center;
    }

    .profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #ead8cf;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 8px;
      font-weight: normal;
    }

    .bio {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
      color: #5e5650;
    }

    .link {
      display: block;
      text-decoration: none;
      color: #2f2a26;
      background: #ffffff;
      border: 1px solid #e3d2c9;
      border-radius: 999px;
      padding: 15px 18px;
      margin: 12px 0;
      font-size: 16px;
    }

    .link:hover {
      background: #f0ded5;
    }

    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: #8a7a70;
    }
  </style>
</head>
<body>
  <main class="container">
    <img class="profile" src="https://via.placeholder.com/300" alt="Creative Block profile image" />

    <h1>Creative Block</h1>

    <p class="bio">
      A temporary home for creative work, style notes, and links.
    </p>

    <a class="link" href="https://instagram.com/YOURUSERNAME">Instagram</a>
    <a class="link" href="https://www.linkedin.com/in/YOURUSERNAME">LinkedIn</a>
    <a class="link" href="mailto:youremail@example.com">Email</a>
    <a class="link" href="#">Portfolio Coming Soon</a>

    <p class="footer">Full site coming soon.</p>
  </main>
</body>
</html>
